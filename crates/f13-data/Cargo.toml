[package]
name = "f13-data"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Loads tuning.json (produced by tools/extract_tuning.py from your own install) into f13-core types"

[dependencies]
f13-core = { path = "../f13-core" }
glam = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
