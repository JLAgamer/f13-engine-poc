[package]
name = "f13-game"
version = "0.3.0"
edition.workspace = true
license.workspace = true
description = "The f13recomp game client (currently a level viewer for the MVP map)"

[dependencies]
f13-core = { path = "../f13-core" }
f13-data = { path = "../f13-data" }
f13-bevy = { path = "../f13-bevy" }
bevy = { version = "0.19", features = ["free_camera", "dds", "pbr_light_textures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Server-authoritative netcode (Milestone 3): UDP with netcode.io authentication, in-process links for tests (no prediction or
# interpolation yet).
lightyear = { version = "0.30.1", default-features = false, features = ["std", "client", "server", "replication", "udp", "netcode", "crossbeam"] }
cpal = "0.18.2"
opus = "0.4.0"

[features]
# Per-system timings in --perf (Bevy's tracing spans; costs a little everywhere, so off by default).
profile = ["bevy/trace", "bevy/debug"]
