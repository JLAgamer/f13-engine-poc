[package]
name = "f13-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The f13-rs game client (currently a level viewer for the MVP map)"

[dependencies]
f13-core = { path = "../f13-core" }
f13-data = { path = "../f13-data" }
f13-bevy = { path = "../f13-bevy" }
bevy = { version = "0.19", features = ["free_camera", "dds"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Per-system timings in --perf (Bevy's tracing spans; costs a little everywhere, so off by default).
profile = ["bevy/trace", "bevy/debug"]
